<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <form>
        <div class="inputname">
            Name <input type="text" placeholder="enter your name">
        </div>
        <div class="matricNo">
            Matric Number <input type="number" placeholder="enter your matric no.">
        </div>
        <div class="phone">
            Phone Number <input type="number" placeholder="active phone number">
        </div>
        <div class="mail">
            Email <input type="email" placeholder="example@gmail.com">
        </div>
        <div class="pasa">
            Password <input type="password" placeholder="enter password">
        </div>
        <div class="gend">
            Gender <select name="sex" id="gen">
                <option value="">Select</option>
                <option value="">Male</option>
                <option value="">Female</option>

            </select>
        </div>
        <div class="prog">
            Department <select name="department" id="dept">
                <option value="">Select</option>
                <option value="">Computer Science</option>
                <option value="">Information Communication Technology</option>
                <option value="">Information Technology</option>
                <option value="">Cyber Security</option>
                <option value="">Data Sceince</option>
                <option value="">Software Engineering</option>
                <option value="">Information Systems</option>

            </select>
        </div>
        <div class="pro">
            Program <select name="progream" id="progm">
                <option value="">Select</option>
                <option value="">Full-Time</option>
                <option value="">Part-Time</option>
                <option value="">Weekend</option>

            </select>
        </div>
        <button>SUBMIT</button>
        
    </form>
</body>
</html>
